<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Course • PrepOne</title><link rel="stylesheet" href="assets/styles.css?v=14.3.8"></head><body><div id="heroSlot"></div><main class="shell"><div id="studentCourseBar"></div><div class="layout courseLayout"><aside class="sidebar glass"><div class="sideTitle">Subjects</div><div id="sideLinks"></div></aside><section class="contentCard glass syllabusCard"><div class="sectionHead"><div><div class="eyebrow">Complete syllabus</div><h2 id="studyTitle">Loading…</h2></div></div><div id="contentStatus" class="contentStatus">Loading course content…</div>
